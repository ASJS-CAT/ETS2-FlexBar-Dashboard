name: Build and validate RC
on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Check exact version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne $version) { throw 'Tag must exactly match the manifest/package version, without v prefix.' }
      - run: npm ci
      - run: npm run build
      - run: npm run native:test
      - run: npm test
      - run: npm run docs
      - run: npm audit --audit-level=moderate
      - run: npm run audit:release
      - run: npm run plugin:validate
      - run: npm run plugin:pack
      - run: npm run rc
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-FlexBar-RC
          path: release-candidate/*/
          if-no-files-found: error
# No repository creation, public release or FlexGate submission occurs here.
